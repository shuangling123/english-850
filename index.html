.mic-btn.listening{border-color:#F44336;background:#FFEBEE;animation:pulse .8s infinite}
.mic-btn.success{border-color:#4CAF50;background:#E8F5E9}
.speak-result{font-size:20px;margin-top:12px;min-height:30px}

// ============ APP STATE ============
const catNames=Object.keys(WORDS);
let currentCat=0,currentWord=0,mode='learn',streak=0,totalCorrect=0;
let quizOpts=[],quizWord=null,quizAnswered=false,quizType='choice'; // choice|listen|spell
let traceWord='',traceWordCn='';
let learned=JSON.parse(localStorage.getItem('eng850_learned')||'{}');

function save(){localStorage.setItem('eng850_learned',JSON.stringify(learned))}
function isLearned(cat,w){return learned[catNames[cat]+'|'+w]||false}
function markLearned(cat,w){learned[catNames[cat]+'|'+w]=true;save();updateStats()}

// ============ RENDER ============
function updateStats(){
let total=0,l=0;
for(const[cn,words]of Object.entries(WORDS)){
total+=words.length;
for(let i=0;i<words.length;i++) if(isLearned(catNames.indexOf(cn),i)) l++;
}
document.getElementById('totalLearned').textContent=l;
document.getElementById('streakCount').textContent=streak;
document.getElementById('starCount').textContent=totalCorrect;
document.getElementById('totalWords').textContent=total;
renderTabs();
}

function renderTabs(){
const container=document.getElementById('tabs');
container.innerHTML=catNames.map((cn,i)=>{
const done=WORDS[cn].filter((_,j)=>isLearned(i,j)).length;
const total=WORDS[cn].length;
return `<div class="tab${i===currentCat?' active':''}" onclick="selectCat(${i})">
${cn.split(' ')[0]} <span style="font-size:10px;opacity:.7">${done}/${total}</span>
</div>`;
}).join('');
}

function selectCat(i){currentCat=i;currentWord=0;render();updateStats()}
function setMode(m){
mode=m;
document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
document.querySelector('.'+m)?.classList.add('active');
render();
}

function render(){
if(mode==='learn') renderLearn();
else if(mode==='quiz') renderQuiz();
else if(mode==='speak') renderSpeak();
else if(mode==='trace') renderTrace();
}

// ============ LEARN MODE ============
function renderLearn(){
const cn=catNames[currentCat];
const words=WORDS[cn];
if(!words||words.length===0) return;
const[wEn,wCn,wIpa]=words[currentWord];
const l=isLearned(currentCat,currentWord);
const total=words.length;
markLearned(currentCat,currentWord);

document.getElementById('mainArea').innerHTML=`
<div class="card-container">
<div class="card" onclick="speakWord('${wEn.replace(/'/g,"\\'")}')">
<div class="card-inner">
<div class="emoji-big">${getEmoji(cn,wEn)}</div>
<div class="word-en">${wEn}</div>
<div class="word-ipa">/${wIpa}/</div>
<div class="word-cn">${wCn}</div>
<div class="tap-hint">👆 点击听发音 | ${l?'✅ 已学':'🆕 新词'}</div>
</div>
</div>
</div>
<div class="card-nav">
<button class="nav-btn" ${currentWord===0?'disabled':''} onclick="prevWord()">◀</button>
<span class="counter">${currentWord+1} / ${total}</span>
<button class="nav-btn" ${currentWord>=total-1?'disabled':''} onclick="nextWord()">▶</button>
</div>
`;
}

function nextWord(){
const words=WORDS[catNames[currentCat]];
if(currentWord<words.length-1){currentWord++;render()}
}
function prevWord(){
if(currentWord>0){currentWord--;render()}
}

// ============ QUIZ MODE ============
function renderQuiz(){
const cn=catNames[currentCat];
const words=WORDS[cn];
if(!words||words.length<4) return;
quizAnswered=false;
// Rotate quiz types
const types=['choice','listen','spell'];
quizType=types[Math.floor(Math.random()*types.length)];

const qi=Math.floor(Math.random()*words.length);
quizWord={idx:qi,en:words[qi][0],cn:words[qi][1]};

if(quizType==='choice') renderQuizChoice(cn,words,qi);
else if(quizType==='listen') renderQuizListen(cn,words,qi);
else renderQuizSpell(cn,words,qi);
}

function renderQuizChoice(cn,words,qi){
const wrongs=[];while(wrongs.length<3){
const ri=Math.floor(Math.random()*words.length);
if(ri!==qi&&!wrongs.includes(ri)) wrongs.push(ri);
}
quizOpts=shuffle([qi,...wrongs]);

document.getElementById('mainArea').innerHTML=`
<div class="quiz-area">
<div class="quiz-type-label">📝 看中文选英文</div>
<div class="quiz-prompt">
<div class="emoji-big">${getEmoji(cn,quizWord.en)}</div>
<div class="cn">${quizWord.cn}</div>
</div>
<div class="quiz-options" id="quizOpts">
${quizOpts.map(i=>`<button class="quiz-opt" onclick="answerQuizChoice(${i},this)">${words[i][0]}</button>`).join('')}
</div>
<div class="quiz-score">🔥 连对: ${streak} | ⭐ 总分: ${totalCorrect}</div>
</div>
`;
}

function renderQuizListen(cn,words,qi){
const wrongs=[];while(wrongs.length<3){
const ri=Math.floor(Math.random()*words.length);
if(ri!==qi&&!wrongs.includes(ri)) wrongs.push(ri);
}
quizOpts=shuffle([qi,...wrongs]);
// Auto-speak the word
setTimeout(()=>speakWord(quizWord.en),500);

document.getElementById('mainArea').innerHTML=`
<div class="quiz-area">
<div class="quiz-type-label">👂 听发音选中文</div>
<div class="quiz-prompt">
<div style="font-size:60px">🔊</div>
<div class="cn" style="color:#1565C0;cursor:pointer" onclick="speakWord('${quizWord.en.replace(/'/g,"\\'")}')">点击再听一遍</div>
</div>
<div class="quiz-options" id="quizOpts">
${quizOpts.map(i=>`<button class="quiz-opt" onclick="answerQuizListen(${i},this)">${words[i][1]}</button>`).join('')}
</div>
<div class="quiz-score">🔥 连对: ${streak} | ⭐ 总分: ${totalCorrect}</div>
</div>
`;
}

function renderQuizSpell(cn,words,qi){
document.getElementById('mainArea').innerHTML=`
<div class="quiz-area">
<div class="quiz-type-label">⌨️ 拼写单词</div>
<div class="quiz-prompt">
<div class="emoji-big">${getEmoji(cn,quizWord.en)}</div>
<div class="cn">${quizWord.cn}</div>
</div>
<div style="margin:10px 0">
<span style="font-size:14px;color:#999">提示: ${quizWord.en.length} 个字母，首字母 "${quizWord.en[0]}"</span>
</div>
<input type="text" class="spell-input" id="spellInput" placeholder="输入英文单词..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<br>
<button class="spell-submit" onclick="answerQuizSpell()">✅ 确认</button>

// ============ SPEAK MODE (Speech Recognition) ============
let recognition=null;
function initSpeech(){
if(recognition) return true;
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognition) return false;
recognition=new SpeechRecognition();
recognition.lang='en-US';
recognition.interimResults=false;
recognition.maxAlternatives=3;
return true;
}

function renderSpeak(){
const cn=catNames[currentCat];
const words=WORDS[cn];
if(!words||words.length===0) return;
// Pick a random word from current category
const wi=Math.floor(Math.random()*words.length);
const[wEn,wCn,wIpa]=words[wi];

document.getElementById('mainArea').innerHTML=`
<div class="speak-card">
<div style="font-size:18px;color:#999;margin-bottom:6px">🎤 大声读出这个单词</div>
<div class="speak-word">${wEn}</div>
<div class="word-ipa">/${wIpa}/</div>
<div class="speak-cn">${wCn}</div>
<div style="font-size:60px;margin:10px">${getEmoji(cn,wEn)}</div>
<button class="mic-btn" id="micBtn" onclick="startListening('${wEn.replace(/'/g,"\\'")}',${currentCat},${wi})">🎙️</button>
<div class="speak-result" id="speakResult"></div>
<button style="margin-top:12px;padding:8px 20px;border-radius:20px;border:2px solid #FFCC80;background:#fff;color:#FF6F00;font-size:16px;cursor:pointer" onclick="speakWord('${wEn.replace(/'/g,"\\'")}')">🔊 听发音</button>
<button style="margin-top:12px;padding:8px 20px;border-radius:20px;border:2px solid #FFCC80;background:#fff;color:#FF6F00;font-size:16px;cursor:pointer;margin-left:8px" onclick="renderSpeak()">➡️ 换一个</button>
</div>
`;
}

function startListening(targetWord,cat,wi){
if(!initSpeech()){
document.getElementById('speakResult').textContent='⚠️ 你的浏览器不支持语音识别，请用Chrome打开';
return;
}
const micBtn=document.getElementById('micBtn');
const resultEl=document.getElementById('speakResult');
micBtn.classList.add('listening');
micBtn.textContent='🔴';
resultEl.textContent='正在听...';

recognition.onresult=function(event){
const said=event.results[0][0].transcript.toLowerCase().trim();
const correct=said===targetWord.toLowerCase();
micBtn.classList.remove('listening');
if(correct){
micBtn.classList.add('success');
resultEl.innerHTML='🌟 太棒了! 发音正确!';
resultEl.style.color='#4CAF50';
markLearned(cat,wi);
updateStats();
burstStar(micBtn);
}else{
resultEl.innerHTML=`😊 你说的是 "${said}"<br>再试一次吧! <br><span style="font-size:14px;color:#999">目标: ${targetWord}</span>`;
resultEl.style.color='#FF6F00';
}
setTimeout(()=>{
micBtn.classList.remove('success');
micBtn.textContent='🎙️';
},1500);
};

recognition.onerror=function(e){
micBtn.classList.remove('listening');
micBtn.textContent='🎙️';
resultEl.textContent='没听清，再试一次吧~';
resultEl.style.color='#999';
};

recognition.onend=function(){
micBtn.classList.remove('listening');
if(micBtn.textContent==='🔴') micBtn.textContent='🎙️';
};

recognition.start();
}

// ============ TRACE MODE (Letter Tracing) ============
let traceCanvas=null,traceCtx=null,traceIsDrawing=false;
let traceColor='#FF6F00',traceLineWidth=6;

function renderTrace(){
const cn=catNames[currentCat];
const words=WORDS[cn];
if(!words||words.length===0) return;
// Pick a word (short ones are better for tracing)
const shortWords=words.filter(w=>w[0].length<=6);
const pool=shortWords.length>0?shortWords:words;
const wi=Math.floor(Math.random()*pool.length);
const[wEn,wCn,wIpa]=pool[wi];
traceWord=wEn;traceWordCn=wCn;

document.getElementById('mainArea').innerHTML=`
<div class="trace-container">
<div class="trace-word">✏️ 描红练习 — ${wCn}  /${wIpa}/</div>
<canvas class="trace-canvas" id="traceCanvas" width="320" height="160"></canvas>
<div class="trace-tools">
<button class="trace-tool active" style="color:#FF6F00;border-color:#FF6F00" onclick="setTraceColor('#FF6F00',this)">🟠 橙色</button>
<button class="trace-tool" style="color:#E91E63;border-color:#E91E63" onclick="setTraceColor('#E91E63',this)">🔴 红色</button>
<button class="trace-tool" style="color:#2196F3;border-color:#2196F3" onclick="setTraceColor('#2196F3',this)">🔵 蓝色</button>
<button class="trace-tool" style="color:#4CAF50;border-color:#4CAF50" onclick="setTraceColor('#4CAF50',this)">🟢 绿色</button>
<button class="trace-tool" style="color:#9C27B0;border-color:#9C27B0" onclick="setTraceColor('#9C27B0',this)">🟣 紫色</button>
<button class="trace-tool" onclick="clearTrace()">🧹 清除</button>
</div>
<div style="margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
<button style="padding:6px 14px;border-radius:20px;border:none;background:#E8F5E9;color:#2E7D32;font-size:14px;cursor:pointer" onclick="speakWord('${traceWord.replace(/'/g,"\\'")}')">🔊 听发音</button>
<button style="padding:6px 14px;border-radius:20px;border:none;background:#FFF3E0;color:#E65100;font-size:14px;cursor:pointer" onclick="renderTrace()">➡️ 换一个</button>
</div>
</div>
`;

setTimeout(()=>{
traceCanvas=document.getElementById('traceCanvas');
if(!traceCanvas) return;
// Adjust canvas size for mobile
const w=Math.min(window.innerWidth-60,320);
traceCanvas.width=w;
traceCanvas.height=160;
traceCtx=traceCanvas.getContext('2d');
drawTraceGuide();
setupTraceEvents();
},100);
}

function drawTraceGuide(){
if(!traceCtx||!traceCanvas) return;
const ctx=traceCtx;
const cw=traceCanvas.width,ch=traceCanvas.height;
ctx.clearRect(0,0,cw,ch);

// Draw guide lines
ctx.strokeStyle='#E0E0E0';
ctx.lineWidth=1;
ctx.setLineDash([5,5]);
ctx.beginPath();
ctx.moveTo(0,ch/2);
ctx.lineTo(cw,ch/2);
ctx.stroke();
ctx.setLineDash([]);

// Draw the word in light gray as a guide
ctx.fillStyle='#D0D0D0';
ctx.font='bold 60px "PingFang SC","Arial Rounded MT Bold",sans-serif';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText(traceWord,cw/2,ch/2);

// Draw dotted letter shapes (simplified)
ctx.fillStyle='#E8E8E8';
ctx.font='bold 58px "PingFang SC","Arial Rounded MT Bold",sans-serif';
ctx.fillText(traceWord,cw/2+1,ch/2+1);
}

function setupTraceEvents(){
if(!traceCanvas) return;
// Touch events
traceCanvas.addEventListener('touchstart',e=>{
e.preventDefault();
traceIsDrawing=true;
const r=traceCanvas.getBoundingClientRect();
const x=e.touches[0].clientX-r.left;
const y=e.touches[0].clientY-r.top;
traceCtx.beginPath();
traceCtx.moveTo(x,y);
});
traceCanvas.addEventListener('touchmove',e=>{
e.preventDefault();
if(!traceIsDrawing) return;
const r=traceCanvas.getBoundingClientRect();
const x=e.touches[0].clientX-r.left;
const y=e.touches[0].clientY-r.top;
traceCtx.lineTo(x,y);
traceCtx.strokeStyle=traceColor;
traceCtx.lineWidth=traceLineWidth;
traceCtx.lineCap='round';
traceCtx.lineJoin='round';
traceCtx.stroke();
});
traceCanvas.addEventListener('touchend',()=>{traceIsDrawing=false});

// Mouse events (for desktop)
traceCanvas.addEventListener('mousedown',e=>{
traceIsDrawing=true;
const r=traceCanvas.getBoundingClientRect();
traceCtx.beginPath();
traceCtx.moveTo(e.clientX-r.left,e.clientY-r.top);
});
traceCanvas.addEventListener('mousemove',e=>{
if(!traceIsDrawing) return;
const r=traceCanvas.getBoundingClientRect();
traceCtx.lineTo(e.clientX-r.left,e.clientY-r.top);
traceCtx.strokeStyle=traceColor;
traceCtx.lineWidth=traceLineWidth;
traceCtx.lineCap='round';
traceCtx.lineJoin='round';
traceCtx.stroke();
});
traceCanvas.addEventListener('mouseup',()=>{traceIsDrawing=false});
traceCanvas.addEventListener('mouseleave',()=>{traceIsDrawing=false});
}

function setTraceColor(color,el){
traceColor=color;
document.querySelectorAll('.trace-tool').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
}

function clearTrace(){
if(!traceCtx||!traceCanvas) return;
drawTraceGuide();
}

function speakWord(word){
if('speechSynthesis' in window){
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(word);
u.lang='en-US';u.rate=.8;u.pitch=1.2;
speechSynthesis.speak(u);
}
}

if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50){
if(dx<0) nextWord(); else prevWord();
}
});
